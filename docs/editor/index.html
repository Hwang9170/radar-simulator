<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1519">
<title>RADR 유지보수 편집기</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 편집기: 왼쪽 = 항목 탭, 가운데 = 편집 폼, 오른쪽 = 실시간 3D 미리보기. 시뮬레이터와 같은 작전 콘솔 톤. */
[hidden]{display:none!important}
:root{
  color-scheme: dark;
  --bg:#0f1519;--panel:#141c22;--panel2:#18222a;--line:#2a3842;--line2:#22303a;
  --fg:#e3e9ec;--muted:#8fa0aa;--accent:#f0b429;--accent-ink:#1a1405;--cyan:#5cc8e0;--ok:#62c98f;--bad:#e8705e;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:transparent;border:1px solid var(--line);border-radius:4px;cursor:pointer;padding:6px 10px;line-height:1.2;white-space:nowrap}
button:hover{border-color:#4a5e6b;background:rgba(255,255,255,.04)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.pri:hover{background:#ffc53d}
button.on{background:rgba(240,180,41,.14);border-color:rgba(240,180,41,.6);color:var(--accent)}
button.danger{color:var(--bad);border-color:rgba(232,112,94,.4)}
button.sm{padding:3px 7px;font-size:12px}
button.ic{width:28px;height:28px;padding:0;display:inline-grid;place-items:center;font-size:13px}
button:disabled{opacity:.4;cursor:default}
input[type=text],input[type=number],select,textarea{background:#0e1418;border:1px solid var(--line);border-radius:4px;padding:6px 8px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.5;min-height:60px}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
input[type=color]{width:38px;height:30px;padding:2px;border:1px solid var(--line);border-radius:4px;background:#0e1418;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.app{display:grid;grid-template-columns:200px minmax(0,1fr) minmax(320px,42%);grid-template-rows:auto minmax(0,1fr);height:100vh;height:100dvh}
.app.nopv{grid-template-columns:200px minmax(0,1fr) 0}
header{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.brand{display:flex;flex-direction:column;line-height:1.25;margin-right:6px}
.brand b{font-size:15px}
.brand span{font-size:11.5px;color:var(--accent);font-weight:600;letter-spacing:.03em}
.status{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.status.dirty{color:var(--accent);border-color:rgba(240,180,41,.5)}
.status.warn{color:var(--bad);border-color:rgba(232,112,94,.5)}
.sp{flex:1}
.hgrp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
nav{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:10px 8px;display:flex;flex-direction:column;gap:2px}
nav button{text-align:left;border-color:transparent;padding:9px 10px;display:flex;gap:9px;align-items:center;font-size:13.5px}
nav button i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted);width:18px}
nav button.cur{background:rgba(240,180,41,.10);border-color:rgba(240,180,41,.5);color:var(--accent);font-weight:600}
nav button.cur i{color:var(--accent)}
nav .navnote{margin-top:auto;font-size:11.5px;color:var(--muted);line-height:1.5;padding:10px 6px 0;border-top:1px solid var(--line2)}
main{overflow:auto;padding:18px 22px 60px;min-width:0}
main h2{margin:0 0 4px;font-size:19px}
.lead{margin:0 0 16px;color:var(--muted);line-height:1.6;font-size:13px;max-width:760px}
.card{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:14px;margin-bottom:12px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card>h3{margin:0;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h3 small{font-weight:400;color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 12px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.f>span em{font-style:normal;font-family:var(--mono);color:var(--cyan);font-size:11px}
.f.full{grid-column:1/-1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chk{display:inline-flex;gap:7px;align-items:center;font-size:13px;cursor:pointer;user-select:none}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.a{color:var(--cyan);border-color:rgba(92,200,224,.5)}
.tag.c{color:var(--accent);border-color:rgba(240,180,41,.5)}
.tag.off{color:var(--bad);border-color:rgba(232,112,94,.45)}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin:0}
.warn{font-size:12.5px;color:var(--bad);line-height:1.5;margin:0}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:4px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:4px 6px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl td.num{font-family:var(--mono);text-align:right;white-space:nowrap}
.tbl input[type=number]{width:84px}
.scroll{overflow-x:auto}
/* 단계 목록 */
.phl{display:flex;flex-direction:column;gap:4px}
.phi{display:grid;grid-template-columns:auto 30px minmax(0,1fr) auto auto;gap:8px;align-items:center;border:1px solid var(--line2);border-radius:5px;padding:6px 8px;background:var(--panel2);cursor:pointer}
.phi:hover{border-color:#3a4c58}
.phi.sel{border-color:rgba(240,180,41,.7);background:rgba(240,180,41,.07)}
.phi.off{opacity:.5}
.phi .n{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;border:1px solid var(--line);border-radius:3px;padding:1px 0}
.phi .t{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phi .t small{color:var(--muted);font-family:var(--mono);font-size:11px;margin-left:6px}
.phi .mv{display:flex;gap:2px}
.phi[draggable=true]{cursor:grab}
.phi.drop{box-shadow:0 -2px 0 var(--accent)}
.steps{display:flex;flex-direction:column;gap:6px}
.steps .row{flex-wrap:nowrap}
.steps input{flex:1}
.eqchips{display:flex;flex-wrap:wrap;gap:6px}
.eqchips label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:4px;padding:4px 8px;font-size:12.5px;cursor:pointer}
.eqchips label.dis{opacity:.45}
/* 장비 */
.eqh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sw{width:14px;height:14px;border-radius:3px;border:1px solid rgba(255,255,255,.25);flex:none}
.split{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:12px;align-items:start}
.list{display:flex;flex-direction:column;gap:4px}
.list button{text-align:left;display:flex;gap:8px;align-items:center;border-color:var(--line2);background:var(--panel2);overflow:hidden}
.list button span.t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.list button.sel{border-color:rgba(240,180,41,.7);background:rgba(240,180,41,.07)}
/* 통계 */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.stats div{border:1px solid var(--line);border-radius:5px;padding:9px 10px;display:flex;flex-direction:column;gap:3px;background:var(--panel2)}
.stats span{font-size:11.5px;color:var(--muted)}
.stats b{font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums}
/* 미리보기 */
aside{border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;background:#0b1013}
.app.nopv aside{display:none}
.pvbar{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.pvbar select{width:auto;max-width:180px;padding:4px 6px;font-size:12.5px}
.pvbar .k{font-size:12px;color:var(--muted)}
#pvWrap{position:relative;flex:1;min-height:0}
#pv{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0f1519}
#pvMsg{position:absolute;left:10px;bottom:10px;font-size:12px;color:var(--cyan);background:rgba(15,21,25,.85);border:1px solid var(--line);border-radius:999px;padding:4px 10px;pointer-events:none;transition:opacity .4s}
/* 토스트 */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;align-items:center;z-index:50;pointer-events:none}
.toast{background:var(--panel);border:1px solid rgba(240,180,41,.6);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.toast.bad{border-color:rgba(232,112,94,.7)}
/* 확인창 */
#dlg{position:fixed;inset:0;background:rgba(5,9,12,.65);display:grid;place-items:center;padding:16px;z-index:60}
#dlgBox{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:14px}
#dlgBox p{margin:0;line-height:1.6}
.exp{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.exp .card{gap:8px}
.exp .card p{margin:0}
ol.how{margin:0;padding-left:20px;line-height:1.75;font-size:13px;color:#cfd8dc}
code{font-family:var(--mono);font-size:12px;background:#0e1418;border:1px solid var(--line2);border-radius:3px;padding:0 4px}
.qi{border:1px solid var(--line2);border-radius:5px;padding:10px;background:var(--panel2);display:flex;flex-direction:column;gap:8px}
.qi .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.qi .opts input:first-child{border-color:rgba(98,201,143,.6)}
@media (max-width:1100px){
  .app,.app.nopv{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;height:auto;min-height:100vh}
  nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px 10px}
  nav button{flex:none}
  nav .navnote{display:none}
  main{padding:14px 16px 40px;overflow:visible}
  aside{border-left:0;border-top:1px solid var(--line);height:70vh}
  .split{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){header .brand span{display:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand"><span>RADR · 유지보수</span><b>시뮬레이터 편집기</b></div>
    <span class="status" id="status">불러오는 중</span>
    <div class="hgrp">
      <button class="sm" id="undo" title="되돌리기 (Ctrl+Z)">되돌리기</button>
      <button class="sm" id="redo" title="다시 실행 (Ctrl+Shift+Z)">다시</button>
    </div>
    <div class="sp"></div>
    <div class="hgrp">
      <button id="hApply" title="이 브라우저에서 시뮬레이터를 열면 수정한 설정으로 동작합니다">이 브라우저에 적용</button>
      <button id="hOpen" title="수정한 설정으로 완성된 시뮬레이터를 새 탭에서 실행">새 탭에서 실행</button>
      <button class="pri" id="hExport" title="수정한 설정이 들어간 완성 시뮬레이터 파일(.html)을 내려받습니다">완성 시뮬레이터 내보내기</button>
      <button id="hPv" class="on" title="미리보기 창 보이기/숨기기">미리보기</button>
    </div>
  </header>
  <nav id="nav" aria-label="편집 항목"></nav>
  <main id="main"></main>
  <aside id="pvPane" aria-label="3D 미리보기">
    <div class="pvbar">
      <span class="k">미리보기</span>
      <select id="pvSize" aria-label="미리보기 크레이터 규모"></select>
      <select id="pvPhase" aria-label="미리보기 단계"></select>
      <button class="sm" id="pvReload" title="수정 내용을 3D에 반영 (Ctrl+Enter)">반영</button>
      <label class="chk" title="수정하면 잠시 뒤 자동으로 미리보기를 새로 그립니다"><input type="checkbox" id="pvAuto" checked>자동</label>
    </div>
    <div id="pvWrap"><iframe id="pv" title="시뮬레이터 미리보기"></iframe><div id="pvMsg">준비 중…</div></div>
  </aside>
</div>
<div id="toasts"></div>
<div id="dlg" hidden><div id="dlgBox" role="dialog" aria-modal="true"><p id="dlgText"></p><div class="row" style="justify-content:flex-end"><button id="dlgNo">취소</button><button class="pri" id="dlgYes">확인</button></div></div></div>

<script src="../sim/data.js"></script>
<script src="../sim/config.js"></script>
<script>
(function(){
'use strict';
// ================= 공통 =================
const $=id=>document.getElementById(id);
const clone=v=>v===undefined?undefined:JSON.parse(JSON.stringify(v));
const store={get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function h(tag,attrs,...kids){const el=document.createElement(tag);
  if(attrs)for(const k in attrs){const v=attrs[k];if(v===undefined||v===null||v===false)continue;
    if(k==='class')el.className=v;else if(k==='text')el.textContent=v;else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);
    else if(k==='value')el.value=v;else if(k==='checked')el.checked=!!v;else el.setAttribute(k,v===true?'':v)}
  kids.flat().forEach(c=>{if(c===null||c===undefined||c===false)return;el.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c)});return el}
function toast(msg,bad){const d=h('div',{class:'toast'+(bad?' bad':''),text:msg});$('toasts').appendChild(d);while($('toasts').children.length>3)$('toasts').firstChild.remove();setTimeout(()=>d.remove(),2800)}
function confirmDlg(text){return new Promise(res=>{$('dlgText').textContent=text;$('dlg').hidden=false;$('dlgYes').focus();
  const done=v=>{$('dlg').hidden=true;$('dlgYes').onclick=$('dlgNo').onclick=null;res(v)};$('dlgYes').onclick=()=>done(true);$('dlgNo').onclick=()=>done(false)})}
const fmt=(v,d=1)=>(+v).toFixed(d);
const hm=min=>{min=Math.max(0,Math.round(min));return Math.floor(min/60)+':'+String(min%60).padStart(2,'0')};
function download(name,text,type){const b=new Blob([text],{type:type||'text/plain'});const u=URL.createObjectURL(b);const a=h('a',{href:u,download:name});document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}

if(!window.RADR_DATA){document.body.innerHTML='<p style="padding:24px;color:#e8705e">../sim/data.js 를 불러오지 못했습니다. docs 폴더를 웹 서버로 열어 주세요 (예: <code>python3 -m http.server</code>).</p>';return}
const DEF=window.RADR_DATA;
const PH_IDS=['alert','assess','debris','cut','excavate','backfill','compact','pour','cure','fod','mark'];
const BUILTIN_NAME={};DEF.phases.forEach(p=>BUILTIN_NAME[p.id]=p.title);

// 시뮬레이터 boot 의 mergeCfg 와 같은 규칙
function merge(a,b){if(b===undefined||b===null)return clone(a);if(a===undefined||a===null)return clone(b);
  if(Array.isArray(a)||Array.isArray(b))return Array.isArray(b)?clone(b):clone(a);
  if(typeof a==='object'){if(typeof b!=='object')return clone(a);const o={};new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>{o[k]=merge(a[k],b[k])});return o}
  return typeof a===typeof b?b:a}
function mergeCfg(def,ov){if(!ov||typeof ov!=='object')return clone(def);const c=merge(def,ov);
  if(ov.sizes&&typeof ov.sizes==='object'&&Object.keys(ov.sizes).length)c.sizes=clone(ov.sizes);
  if(Array.isArray(ov.phases)&&ov.phases.length){const byId={};def.phases.forEach(p=>byId[p.id]=p);const seen={};
    c.phases=ov.phases.filter(p=>p&&typeof p==='object').map(p=>{const d=byId[p.id];if(d){seen[p.id]=1;return merge(d,p)}return clone(p)});
    def.phases.forEach(p=>{if(!seen[p.id])c.phases.push(Object.assign(clone(p),{on:false}))})}
  else c.phases=clone(def.phases);
  return c}

// ================= 상태 =================
let cfg;
{const draft=store.get('radr.editor.draft');const applied=store.get('radr.cfg');
  cfg=mergeCfg(DEF,draft||applied||window.RADR_CONFIG||null);}
let tab=/^#phases\/\d+$/.test(location.hash)?'phases':(location.hash.slice(1)&&['overview','sizes','method','phases','equipment','crew','anim','quiz','export'].includes(location.hash.slice(1)))?location.hash.slice(1):(store.get('radr.editor.tab')||'overview');
let selPhase=(/^#phases\/(\d+)$/.exec(location.hash)||[0,0])[1]|0,selEq=DEF.equipment.order[0],quizList='bank',quizFilter='';
const hist={stack:[JSON.stringify(cfg)],i:0};
let commitT=null;
function snapshot(){const s=JSON.stringify(cfg);if(s===hist.stack[hist.i])return;hist.stack=hist.stack.slice(0,hist.i+1);hist.stack.push(s);if(hist.stack.length>80)hist.stack.shift();hist.i=hist.stack.length-1}
// changed(): 값이 바뀔 때마다 호출. structural=true 면 현재 탭을 다시 그림
function changed(structural){store.set('radr.editor.draft',cfg);clearTimeout(commitT);commitT=setTimeout(snapshot,350);if(structural){snapshot();render()}else{updateStatus();refreshSide()}schedulePreview()}
function undo(){snapshot();if(hist.i<=0)return;hist.i--;cfg=JSON.parse(hist.stack[hist.i]);store.set('radr.editor.draft',cfg);render();schedulePreview()}
function redo(){if(hist.i>=hist.stack.length-1)return;hist.i++;cfg=JSON.parse(hist.stack[hist.i]);store.set('radr.editor.draft',cfg);render();schedulePreview()}
$('undo').onclick=undo;$('redo').onclick=redo;

// path 기반 get/set
function getP(path){return path.split('.').reduce((o,k)=>o==null?o:o[k],cfg)}
function setP(path,v){const ks=path.split('.');let o=cfg;for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null)o[ks[i]]={};o=o[ks[i]]}o[ks[ks.length-1]]=v}

// ================= 계산 · 검증 =================
const S_MAX=14;
function derive(sz){const m=cfg.method;const R=(+sz.dia)/2;const upR=R*m.upFactor;let S=Math.ceil((upR+m.cutMargin)*2)/2;const clamped=S>S_MAX;if(clamped)S=S_MAX;
  const maxDia=2*(S_MAX-0.5-m.cutMargin)/m.upFactor;
  const slab=m.slab,cap=Math.min(m.cap,slab-0.05),depth=Math.max(+sz.depth,slab+0.2);const r0=R*Math.sqrt(Math.max(0,1-slab/depth));
  return {R,upR,S,clamped:(+sz.dia)>maxDia,maxDia,cut:2*S,perim:8*S,conc:(2*S)**2*cap,fill:Math.PI*r0*r0*(depth-slab)/2+(2*S)**2*(slab-cap),remove:(2*S)**2*slab}}
const visPhases=()=>cfg.phases.filter(p=>p.on!==false);
function problems(){const w=[];const m=cfg.method;

  const box=h('div',{class:'list',style:'gap:8px'});
  const phOpts=[['','(연결 없음)'],...PH_IDS.map((id,i)=>[String(i),`${BUILTIN_NAME[id]}`])];
  const sel=(val,on)=>{const s=h('select');phOpts.forEach(([v,t])=>s.appendChild(h('option',{value:v,text:t})));s.value=val===undefined||val===null||val<0?'':String(val);s.onchange=()=>on(s.value===''?undefined:+s.value);return s};
  function draw(){box.innerHTML='';const f=quizFilter.trim().toLowerCase();let shown=0;
    L.forEach((q,j)=>{if(f&&!JSON.stringify(q).toLowerCase().includes(f))return;shown++;
      const qq=h('input',{type:'text',value:q.q||'','aria-label':'질문'});qq.oninput=()=>{q.q=qq.value;changed(false)};
      const cat=h('input',{type:'text',value:q.c||'',style:'width:90px','aria-label':'분류',list:'cats'});cat.oninput=()=>{q.c=cat.value;changed(false)};
      const opts=h('div',{class:'opts'});q.o=q.o||['','','',''];while(q.o.length<4)q.o.push('');q.o.forEach((o,k)=>{const i=h('input',{type:'text',value:o,placeholder:k?'오답 '+k:'정답','aria-label':k?'오답 '+k:'정답'});i.oninput=()=>{q.o[k]=i.value;changed(false)};opts.appendChild(i)});
      const ex=h('input',{type:'text',value:q.ex||'','aria-label':'해설',placeholder:'해설'});ex.oninput=()=>{q.ex=ex.value;changed(false)};
      box.appendChild(h('div',{class:'qi'},h('div',{class:'row',style:'flex-wrap:nowrap'},h('span',{class:'tag',text:String(j+1)}),cat,qq,h('button',{class:'ic danger',title:'삭제',onclick:async()=>{if(await confirmDlg('이 문제를 삭제할까요?')){L.splice(j,1);changed(true)}}},'✕')),opts,ex,
        h('div',{class:'row'},h('span',{class:'note',text:'관련 단계'}),sel(q.ph,v=>{q.ph=v===undefined?-1:v;changed(false)}),h('span',{class:'note',text:'문제와 함께 보여줄 장면'}),sel(q.sc,v=>{if(v===undefined)delete q.sc;else q.sc=v;changed(false)}))))});
    if(!shown)box.appendChild(h('p',{class:'note',text:'해당하는 문제가 없습니다.'}))}
  draw();
  const cats=h('datalist',{id:'cats'});['절차','장비','수치','용어','영어'].forEach(c=>cats.appendChild(h('option',{value:c})));
  m.append(card('문제 목록',`${L.length}문항`,cats,h('div',{class:'row'},h('button',{class:quizList==='bank'?'on':'',onclick:()=>{quizList='bank';render()}},`종합 평가 (${cfg.quiz.bank.length})`),h('button',{class:quizList==='en'?'on':'',onclick:()=>{quizList='en';render()}},`영어 용어 (${cfg.quiz.en.length})`),h('div',{class:'sp'}),fl),box,
    h('div',{class:'row'},h('button',{onclick:()=>{L.unshift({c:quizList==='en'?'영어':'절차',q:'',o:['','','',''],ph:-1,ex:''});quizFilter='';changed(true)}},'+ 문제 추가'),h('button',{onclick:async()=>{if(await confirmDlg('이 목록을 기본 문제로 되돌릴까요?')){cfg.quiz[quizList]=clone(DEF.quiz[quizList]);changed(true)}}},'기본 문제로'))));
};
// ---------- 08 내보내기 ----------
VIEWS.export=m=>{
  m.append(h('h2',{text:'내보내기 · 배포'}),h('p',{class:'lead',text:'수정한 설정으로 지금과 같은 완성 시뮬레이터를 만들어 배포합니다.'}));
  const applied=!!store.get('radr.cfg');
  m.append(h('div',{class:'exp'},
    card('완성 시뮬레이터 파일','추천',h('p',{class:'note',text:'수정한 설정이 들어간 시뮬레이터 한 파일(.html)을 내려받습니다. 더블클릭으로 바로 실행되고, 메일·USB·사내 서버로 그대로 나눠줄 수 있습니다. (3D 엔진은 인터넷에서 불러옵니다)'}),h('div',{class:'row'},h('button',{class:'pri',onclick:exportStandalone},'완성 시뮬레이터 내보내기'),h('button',{onclick:openStandalone},'새 탭에서 실행'))),
    card('사이트 전체에 배포',null,h('p',{class:'note',text:'배포용 config.js를 받아 저장소의 docs/sim/config.js 에 덮어쓰고 main 에 올리면(push) GitHub Pages 사이트의 시뮬레이터가 모두 이 설정으로 바뀝니다.'}),h('div',{class:'row'},h('button',{onclick:exportConfigJs},'배포용 config.js 내보내기'))),
    card('이 브라우저에 적용',applied?'적용 중':'미적용',h('p',{class:'note',text:'이 컴퓨터·브라우저에서 시뮬레이터(../sim/)를 열면 수정한 설정으로 동작합니다. 다른 사람에게는 영향이 없습니다.'}),h('div',{class:'row'},h('button',{class:'pri',onclick:applyLocal},'적용'),h('button',{disabled:!applied,onclick:()=>{store.del('radr.cfg');toast('이 브라우저 적용을 해제했습니다');render()}},'적용 해제'),h('a',{href:'../sim/',target:'_blank',rel:'noopener',style:'color:var(--cyan);font-size:13px'},'시뮬레이터 열기 ↗'))),
    card('백업 · 불러오기',null,h('p',{class:'note',text:'설정을 JSON 파일로 저장하거나, 저장해 둔 파일·config.js를 불러옵니다.'}),h('div',{class:'row'},h('button',{onclick:()=>download(`radr-config-${stamp()}.json`,JSON.stringify(cfg,null,2),'application/json')},'JSON 저장'),h('button',{onclick:()=>$('fileIn').click()},'파일 불러오기'))),
    card('초기화',null,h('p',{class:'note',text:'모든 항목을 시뮬레이터 기본값으로 되돌립니다. (되돌리기 ↶ 로 취소할 수 있습니다)'}),h('div',{class:'row'},h('button',{class:'danger',onclick:async()=>{if(await confirmDlg('모든 설정을 기본값으로 되돌릴까요?')){cfg=clone(DEF);changed(true);toast('기본값으로 되돌렸습니다')}}},'전체 기본값으로')))));
  m.append(card('사이트 배포 절차 (관리자)',null,h('ol',{class:'how'},
    h('li',null,'「배포용 config.js 내보내기」로 파일을 받습니다.'),
    h('li',null,'저장소의 ',h('code',{text:'docs/sim/config.js'}),' 를 받은 파일로 바꿉니다.'),
    h('li',null,h('code',{text:'git add docs/sim/config.js && git commit -m "Update simulator config" && git push'})),
    h('li',null,'1~2분 뒤 GitHub Pages에 반영됩니다. 기본값을 보고 싶으면 주소 뒤에 ',h('code',{text:'?cfg=default'}),' 를 붙입니다.'))));
};
const stamp=()=>new Date().toISOString().slice(0,16).replace(/[-:T]/g,'');
const fileIn=h('input',{type:'file',id:'fileIn',accept:'.json,.js,application/json,text/javascript',hidden:true});document.body.appendChild(fileIn);
fileIn.onchange=async()=>{const f=fileIn.files[0];fileIn.value='';if(!f)return;try{let t=await f.text();t=t.replace(/^[\s\S]*?window\.RADR_CONFIG\s*=\s*/,'').replace(/;\s*$/,'');const o=JSON.parse(t);if(!o||typeof o!=='object')throw 0;cfg=mergeCfg(DEF,o);changed(true);toast('설정을 불러왔습니다')}catch(e){toast('설정 파일을 읽지 못했습니다',true)}};

// ================= 내보내기 동작 =================
function applyLocal(){if(store.set('radr.cfg',cfg)){toast('이 브라우저의 시뮬레이터에 적용했습니다');render()}else toast('저장하지 못했습니다',true)}
$('hApply').onclick=applyLocal;
function exportConfigJs(){download('config.js',`// RADR 시뮬레이터 배포 설정 · 유지보수 편집기에서 ${new Date().toLocaleString('ko-KR')} 내보냄\n// docs/sim/config.js 에 덮어쓰면 사이트의 시뮬레이터에 적용됩니다.\nwindow.RADR_CONFIG = ${JSON.stringify(cfg,null,2)};\n`,'text/javascript');toast('config.js 를 내려받았습니다')}
const safeJson=o=>JSON.stringify(o).replace(/</g,'\\u003c').replace(/[\u2028\u2029]/g,c=>'\\u'+c.charCodeAt(0).toString(16));
async function buildStandalone(){
  const [html,data]=await Promise.all([fetch('../sim/index.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('sim');return r.text()}),fetch('../sim/data.js',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('data');return r.text()})]);
  const tag=/<script src="data\.js"><\/script>\s*<script src="config\.js"><\/script>/;if(!tag.test(html))throw new Error('marker');
  const inline=`<script>\n${data.replace(/<\/script/gi,'<\\/script')}\n<\/script>\n<script>window.RADR_STANDALONE=true;window.RADR_CONFIG=${safeJson(cfg)};<\/script>`;
  let out=html.replace(tag,()=>inline);
  const site=new URL('../',location.href).href;
  out=out.replace('<link rel="icon" href="../favicon.svg" type="image/svg+xml">',()=>`<link rel="icon" href="${site}favicon.svg" type="image/svg+xml">`).replace('<a class="help" href="../"',()=>`<a class="help" target="_blank" rel="noopener" href="${site}"`);
  const title=(cfg.meta&&cfg.meta.title)||'활주로 피해복구 훈련';
  out=out.replace(/<title>[^<]*<\/title>/,()=>`<title>${title.replace(/[<&]/g,c=>c==='<'?'&lt;':'&amp;')}</title>`);
  return out}
async function exportStandalone(){try{const out=await buildStandalone();download(`RADR-시뮬레이터-${stamp()}.html`,out,'text/html');toast('완성 시뮬레이터 파일을 내려받았습니다')}catch(e){console.error(e);toast(location.protocol==='file:'?'파일로 열린 상태에서는 만들 수 없습니다. 웹 서버(사이트)에서 열어 주세요':'시뮬레이터 파일을 읽지 못했습니다',true)}}
async function openStandalone(){const w=window.open('','_blank');try{const out=await buildStandalone();const u=URL.createObjectURL(new Blob([out],{type:'text/html'}));if(w)w.location.href=u;else location.href=u}catch(e){if(w)w.close();store.set('radr.cfg.preview',cfg);window.open('../sim/?preview=1','_blank')}}
$('hExport').onclick=exportStandalone;$('hOpen').onclick=openStandalone;

// ================= 미리보기 =================
const pv=$('pv');let pvT=null,pvReady=false,pvPhase=0,pvSize=null;
function pvMsg(t,hold){const e=$('pvMsg');e.textContent=t;e.style.opacity=1;clearTimeout(e._t);if(!hold)e._t=setTimeout(()=>e.style.opacity=0,1800)}
function pvLoad(){if(!$('app').classList.contains('nopv')){pvReady=false;store.set('radr.cfg.preview',cfg);const q=new URLSearchParams({preview:'1',phase:String(Math.max(0,pvPhase))});if(pvSize&&cfg.sizes[pvSize])q.set('size',pvSize);pv.src='../sim/?'+q.toString();pvMsg('3D 다시 그리는 중…',true)}}
function schedulePreview(){if(!$('pvAuto').checked){pvMsg('「반영」을 누르면 3D에 적용됩니다',true);return}clearTimeout(pvT);pvT=setTimeout(pvLoad,1400)}
window.addEventListener('message',e=>{if(e.source!==pv.contentWindow)return;const d=e.data;if(d&&d.type==='radr-ready'){pv.contentWindow.postMessage({type:'radr-config',cfg:JSON.parse(JSON.stringify(cfg))},'*');pvReady=true;pvMsg('미리보기 반영됨')}});
pv.addEventListener('load',()=>{if(!pvReady)setTimeout(()=>{if(!pvReady)pvMsg('미리보기 반영됨')},2600)});
function post(m){try{pv.contentWindow.postMessage(m,'*')}catch(e){}}
function pvJump(i){if(i<0)return;pvPhase=i;$('pvPhase').value=String(i);post({type:'radr-jump',phase:i})}
function pvSel(k){if(cfg.equipment.items[k].on!==false)post({type:'radr-sel',k})}
function refreshPvSelects(){const ps=$('pvPhase');ps.innerHTML='';visPhases().forEach((p,i)=>ps.appendChild(h('option',{value:i,text:`${String(i).padStart(2,'0')} ${p.title}`})));if(pvPhase>=ps.options.length)pvPhase=0;ps.value=String(pvPhase);
  const ss=$('pvSize');ss.innerHTML='';Object.entries(cfg.sizes).forEach(([k,v])=>ss.appendChild(h('option',{value:k,text:v.label})));if(!cfg.sizes[pvSize])pvSize=cfg.sizes[cfg.defaultSize]?cfg.defaultSize:Object.keys(cfg.sizes)[0];ss.value=pvSize||''}
$('pvPhase').onchange=e=>pvJump(+e.target.value);
$('pvSize').onchange=e=>{pvSize=e.target.value;post({type:'radr-size',size:pvSize})};
$('pvReload').onclick=()=>{clearTimeout(pvT);pvLoad()};
$('pvAuto').onchange=e=>{if(e.target.checked)pvLoad()};
$('hPv').onclick=()=>{const app=$('app');const off=!app.classList.toggle('nopv');$('hPv').classList.toggle('on',off);if(off&&!pv.src.includes('/sim/'))pvLoad();else if(off)pvLoad()};
// 좁은 화면에서는 미리보기를 처음에 끈 상태로 (3D 렌더링 부담)
if(window.innerWidth<700){$('app').classList.add('nopv');$('hPv').classList.remove('on')}

window.addEventListener('keydown',e=>{const mod=e.ctrlKey||e.metaKey;if(!mod)return;const inField=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if(e.key.toLowerCase()==='z'&&!inField){e.preventDefault();e.shiftKey?redo():undo()}else if(e.key==='Enter'){e.preventDefault();clearTimeout(pvT);pvLoad()}else if(e.key.toLowerCase()==='s'){e.preventDefault();applyLocal()}});
window.addEventListener('beforeunload',()=>store.set('radr.editor.draft',cfg));

render();pvLoad();
})();
</script>
</body>
